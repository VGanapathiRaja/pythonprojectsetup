{% extends 'base.html' %}
{%block title %} {{Studets}} {%endblock%}

{%block content%}
<div>
    <h1>hello studets page</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="inputs">
            <label for="studenetname">s Name</label>
            <input type="text" name="sname" value="{{updatedata.sname}}" placeholder="Enter your full Name" required>
        </div>

        <div class="inputs">
            <label for="studenetname">s Email</label>
            <input type="email" name="semail" value="{{updatedata.semail}}" placeholder="Enter your full email"
                required>
        </div>

        <div class="inputs">
            <label for="studenetname">s Mobile</label>
            <input type="tel" name="smobile" value="{{updatedata.smobile}}" placeholder="Enter your full Mobile"
                required>
        </div>

        <div class="inputs">
            <label for="studenetname">s Age</label>
            <input type="number" name="sage" value="{{updatedata.sage}}" placeholder="Enter your full Age" required>
        </div>

        <div class="inputs">
            <button type="submit">update data </button>
        </div>
    </form>
</div>

{%endblock%}
